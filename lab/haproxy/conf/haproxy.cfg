global
  stats timeout 30s
  ssl-load-extra-del-ext
  ssl-load-extra-files key

  log stdout format raw daemon debug

defaults
  mode http
  timeout connect 10m
  timeout client  10m
  timeout server  10m

  log 127.0.0.1 local0 debug

frontend haproxy
  bind *:80
  bind *:443 ssl crt /etc/haproxy/certs/cert.crt alpn h2
  bind quic4@:443 ssl crt /etc/haproxy/certs/cert.crt alpn h3

  option httplog

  http-request redirect scheme https unless { ssl_fc }

  http-response set-header alt-svc "h3=\":443\";ma=900;"

  acl forbidden_path path -i /admin
  http-request deny if forbidden_path
  
  default_backend api_server

backend api_server
  balance roundrobin
  #server api_server squid:3128 check
  server api_server apache:80 check
  #server api_server varnish:80 check
  #server api_server caddy:80 check
  #server api_server backend-server:8080 check
  #server api_server nginx:80 check



