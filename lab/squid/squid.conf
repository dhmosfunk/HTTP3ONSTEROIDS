http_port 3128 accel defaultsite=backend-server

cache_peer backend-server parent 8080 0 no-query originserver name=myAccel

acl all src 0.0.0.0/0
http_access allow all

cache_peer_access myAccel allow all
never_direct allow all

request_header_add X-Forwarded-For %>h
request_header_add Host backend-server